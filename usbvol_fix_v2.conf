# USB Volume Fix v2 Configuration
# Copied to /data/adb/service.d/usbvol_fix_v2/ on first boot (post-fs-data.sh).
# Edit that copy to tune; reboot to apply (daemon sources it at start).

# Poll interval ms (200 = 0.2s). Lower = more responsive, more CPU.
poll_ms=200

# Stream to monitor (3 = STREAM_MUSIC)
stream=3
stream_max=160

# USB DAC ALSA controls (card 1, discovered on Lenovo Xiaoxin Pro GT 13)
usb_l_ctrl=3
usb_l_max=11520
usb_r_ctrl=5
usb_r_max=8191

# gamma is fixed at 0.3 (precomputed lookup table in daemon; not regenerated at runtime)
gamma=0.3
